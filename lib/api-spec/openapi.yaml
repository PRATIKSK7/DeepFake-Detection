openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DeepGuard MLOps API for deep fake and AI-generated image detection
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: detections
    description: Image/video upload and detection operations
  - name: analytics
    description: MLOps analytics and model metrics
  - name: models
    description: Model management and monitoring

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /detections:
    get:
      operationId: listDetections
      tags: [detections]
      summary: List all detection results
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: verdict
          schema:
            type: string
            enum: [real, fake, uncertain]
      responses:
        "200":
          description: List of detections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionListResponse"
    post:
      operationId: createDetection
      tags: [detections]
      summary: Submit file for detection analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDetectionBody"
      responses:
        "201":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"

  /detections/{id}:
    get:
      operationId: getDetection
      tags: [detections]
      summary: Get a specific detection result
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
        "404":
          description: Not found

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get overall detection analytics summary
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/trends:
    get:
      operationId: getDetectionTrends
      tags: [analytics]
      summary: Get detection trends over time
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Trend data points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendResponse"

  /analytics/model-performance:
    get:
      operationId: getModelPerformance
      tags: [analytics]
      summary: Get model performance metrics
      responses:
        "200":
          description: Model performance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPerformanceResponse"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List available detection models
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"

  /analytics/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [analytics]
      summary: Get recent detection activity feed
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivityResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateDetectionBody:
      type: object
      properties:
        filename:
          type: string
        fileType:
          type: string
          enum: [image, video]
        fileSize:
          type: integer
        base64Data:
          type: string
      required:
        - filename
        - fileType
        - fileSize

    HeatmapPoint:
      type: object
      properties:
        x:
          type: number
          format: float
          description: Normalized X position 0-1
        y:
          type: number
          format: float
          description: Normalized Y position 0-1
        intensity:
          type: number
          format: float
          description: Attention intensity 0-1
        radius:
          type: number
          format: float
      required:
        - x
        - y
        - intensity
        - radius

    Detection:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        fileType:
          type: string
          enum: [image, video]
        fileSize:
          type: integer
        verdict:
          type: string
          enum: [real, fake, uncertain]
        confidenceScore:
          type: number
          format: float
        fakeScore:
          type: number
          format: float
        realScore:
          type: number
          format: float
        modelScores:
          type: array
          items:
            $ref: "#/components/schemas/ModelScore"
        detectionArtifacts:
          type: array
          items:
            type: string
        heatmapPoints:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapPoint"
          description: Grad-CAM attention points for visualization
        processingTimeMs:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - fileType
        - fileSize
        - verdict
        - confidenceScore
        - fakeScore
        - realScore
        - modelScores
        - detectionArtifacts
        - heatmapPoints
        - processingTimeMs
        - createdAt

    ModelScore:
      type: object
      properties:
        modelName:
          type: string
        modelVersion:
          type: string
        score:
          type: number
          format: float
        verdict:
          type: string
          enum: [real, fake, uncertain]
        weight:
          type: number
          format: float
      required:
        - modelName
        - modelVersion
        - score
        - verdict
        - weight

    DetectionListResponse:
      type: object
      properties:
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - detections
        - total
        - page
        - limit

    AnalyticsSummary:
      type: object
      properties:
        totalAnalyzed:
          type: integer
        fakeDetected:
          type: integer
        realDetected:
          type: integer
        uncertainDetected:
          type: integer
        averageConfidence:
          type: number
          format: float
        fakePercentage:
          type: number
          format: float
        averageProcessingMs:
          type: integer
        totalImagesAnalyzed:
          type: integer
        totalVideosAnalyzed:
          type: integer
      required:
        - totalAnalyzed
        - fakeDetected
        - realDetected
        - uncertainDetected
        - averageConfidence
        - fakePercentage
        - averageProcessingMs
        - totalImagesAnalyzed
        - totalVideosAnalyzed

    TrendDataPoint:
      type: object
      properties:
        date:
          type: string
        totalAnalyzed:
          type: integer
        fakeCount:
          type: integer
        realCount:
          type: integer
        uncertainCount:
          type: integer
        avgConfidence:
          type: number
          format: float
      required:
        - date
        - totalAnalyzed
        - fakeCount
        - realCount
        - uncertainCount
        - avgConfidence

    TrendResponse:
      type: object
      properties:
        trends:
          type: array
          items:
            $ref: "#/components/schemas/TrendDataPoint"
        days:
          type: integer
      required:
        - trends
        - days

    ModelPerformance:
      type: object
      properties:
        modelName:
          type: string
        modelVersion:
          type: string
        accuracy:
          type: number
          format: float
        precision:
          type: number
          format: float
        recall:
          type: number
          format: float
        f1Score:
          type: number
          format: float
        falsePositiveRate:
          type: number
          format: float
        falseNegativeRate:
          type: number
          format: float
        avgInferenceMs:
          type: integer
        totalInferences:
          type: integer
        status:
          type: string
          enum: [active, degraded, offline]
      required:
        - modelName
        - modelVersion
        - accuracy
        - precision
        - recall
        - f1Score
        - falsePositiveRate
        - falseNegativeRate
        - avgInferenceMs
        - totalInferences
        - status

    ModelPerformanceResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelPerformance"
      required:
        - models

    ModelInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [cnn, transformer, ensemble, gan-detector]
        status:
          type: string
          enum: [active, degraded, offline]
        weight:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - version
        - description
        - type
        - status
        - weight
        - createdAt

    ModelListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
      required:
        - models

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        verdict:
          type: string
          enum: [real, fake, uncertain]
        confidenceScore:
          type: number
          format: float
        fileType:
          type: string
          enum: [image, video]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - verdict
        - confidenceScore
        - fileType
        - createdAt

    RecentActivityResponse:
      type: object
      properties:
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        - activity
